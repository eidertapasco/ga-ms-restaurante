services:

  mysql:
    image: mysql:8.0
    container_name: gastrosena-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modulo_restaurante
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gastrosena-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    image: stiven77/api-gateway-gastrosena:latest
    container_name: gastrosena-gateway
    ports:
      - "8088:8088"
    environment:
      GATEWAY_PORT: 8088
      SVC_RESTAURANTE_URI: http://restaurante:8080
      SECURITY_SECRET: ZGV2LXBsYWNlaG9sZGVyLXNlY3JldC1vdmVycmlkZS13aXRoLVNFQ1VSSVRZX1NFQ1JFVC1pbi1wcm9k
    depends_on:
      - restaurante
    restart: on-failure

  restaurante:
    image: eidertapasco/ga-ms-restaurante:latest
    container_name: gastrosena-restaurante
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SSL: ${RABBITMQ_SSL:-false}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure

volumes:
  mysql_data:
