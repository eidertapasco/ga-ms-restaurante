# ========================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ========================================
spring.application.name=ga-ms-restaurante

# ========================================
# CONFIGURACIÓN DEL SERVIDOR
# ========================================
server.port=8080

# ========================================
# CONFIGURACIÓN DE BASE DE DATOS (H2)
# ========================================

# URL de conexión JDBC
# mem = base de datos en memoria (se elimina al apagar la app)
spring.datasource.url=jdbc:h2:mem:ga-ms-restaurante_db

# Credenciales por defecto de H2
spring.datasource.username=sa
spring.datasource.password=

# Driver JDBC (puente entre Java y la base de datos)
spring.datasource.driver-class-name=org.h2.Driver

# Dialecto que Hibernate usa para generar SQL compatible con H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ========================================

# Estrategia de creación de tablas:
# create-drop = crea al iniciar y elimina al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# Diferir la inicialización del data.sql hasta que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# Mostrar consultas SQL en consola
spring.jpa.show-sql=true

# Formatear el SQL para que sea legible
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# HERRAMIENTAS DE DESARROLLO (H2 CONSOLE)
# ========================================

# Habilitar consola web de H2
spring.h2.console.enabled=true

# Ruta donde se accede a la consola
spring.h2.console.path=/h2-console


