# ========================================
# CONFIGURACION GENERAL DEL PERFIL
# ========================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=ga-ms-restaurante

# ========================================
# CONFIGURACION DEL SERVIDOR
# ========================================
server.port=8080

# ========================================
# CONEXION CON EL MICROSERVICIO DE USUARIOS
# ========================================
api.usuarios.url=http://10.0.2.15:8081

# ========================================
# BASE DE DATOS LOCAL (H2 EN MEMORIA)
# ========================================
spring.datasource.url=jdbc:h2:mem:ga-ms-restaurante_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ========================================
# CONFIGURACION DE JPA / HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CONSOLA VISUAL DE LA BASE DE DATOS (H2)
# ========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# CONFIGURACION DE RABBITMQ
# ========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================================
# DOCUMENTACION DE ENDPOINTS (SWAGGER)
# ========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ========================================
# CONFIGURACIONES DE ga-lib-security
# ========================================
