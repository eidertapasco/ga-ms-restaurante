# =====================================================
# APLICACIÓN
# =====================================================
spring.application.name=ga-ms-restaurante
server.port=8080


# =====================================================
# BASE DE DATOS - MYSQL (LOCAL)
# =====================================================
# MySQL corriendo en localhost (puerto 3306 por defecto)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/modulo_restaurante?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password= J1405Fer*


# =====================================================
# JPA / HIBERNATE
# =====================================================
# Dialecto de MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actualiza las tablas automáticamente según las entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
