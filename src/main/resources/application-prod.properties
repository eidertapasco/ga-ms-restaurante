# ========================================
# CONFIGURACI�N GENERAL
# ========================================
spring.application.name=ga-ms-restaurante
server.port=8080

# ========================================
# BASE DE DATOS ? MySQL
# ========================================
# En Docker, "mysql" es el nombre del contenedor (no localhost)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/modulo_restaurante?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ========================================
# JPA / HIBERNATE
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# update = crea tablas si no existen, no borra datos
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Fix UUID con MySQL ? Hibernate 6 por defecto usa binario, forzamos texto
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ========================================
# H2 ? deshabilitado en prod
# ========================================
spring.h2.console.enabled=false

# ========================================
# RABBITMQ
# ========================================
# En Docker, "rabbitmq" es el nombre del contenedor
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ========================================
# SWAGGER
# ========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ========================================
# SERIALIZACI�N JSON
# ========================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ========================================
# CONFIGURACIONES DE SEGURIDAD Y ACTUATOR
# ========================================
management.endpoints.web.exposure.include=health