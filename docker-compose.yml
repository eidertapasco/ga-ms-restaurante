version: '3.8'

services:

  # ─── Base de datos MySQL ───────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: gastrosena-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modulo_restaurante
      MYSQL_USER: gastrosena
      MYSQL_PASSWORD: gastrosena123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mensajería RabbitMQ ───────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: gastrosena-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  # ─── Backend Spring Boot ───────────────────────────────────────────────────
  restaurante:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastrosena-restaurante
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      SPRING_JPA_PROPERTIES_HIBERNATE_TYPE_PREFERRED__UUID__JDBC__TYPE: CHAR
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: on-failure

# ─── Volúmenes persistentes ────────────────────────────────────────────────
volumes:
  mysql_data: