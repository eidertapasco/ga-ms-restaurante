name: Build and Push Docker Image

# Se ejecuta cuando haces push a la rama feature/docker
on:
  push:
    branches:
      - feature/docker
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub usa su propio Ubuntu — no el tuyo

    steps:

      # 1. Descarga tu código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configura Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Caché de dependencias Maven (acelera builds futuros)
      - name: Caché Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4. Compila y empaqueta el .jar
      - name: Build con Maven
        run: mvn clean package -DskipTests

      # 5. Inicia sesión en Docker Hub con tus secretos
      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Construye la imagen y la sube a Docker Hub
      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ga-ms-restaurante:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ga-ms-restaurante:1.0.0